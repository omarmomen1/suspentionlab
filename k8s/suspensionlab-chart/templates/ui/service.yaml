apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: suspensionlab
    component: ui
spec:
  selector:
    app: suspensionlab
    component: ui
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
