{{- if and .Values.ui.autoscaling .Values.ui.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-ui-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    app: suspensionlab
    component: ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-ui
  minReplicas: {{ .Values.ui.autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ .Values.ui.autoscaling.maxReplicas | default 10 }}
  metrics:
  {{- if .Values.ui.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.ui.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
  {{- if .Values.ui.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.ui.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
{{- end }}
