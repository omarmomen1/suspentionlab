{{- if .Values.monitoring.prometheusRule.enabled }}
# PrometheusRule — defines alerting rules for the SuspensionLab platform.
# Requires kube-prometheus-stack with Alertmanager configured to route to
# PagerDuty/Slack/email. These alerts cover the most critical failure modes.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  namespace: suspensionlab-prod
  labels:
    app: suspensionlab
    release: kube-prometheus-stack
spec:
  groups:
    # ── API Health ────────────────────────────────────────────────────────────
    - name: suspensionlab.api.health
      interval: 30s
      rules:
        - alert: APIHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{job="suspensionlab-api", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="suspensionlab-api"}[5m]))
            ) > 0.05
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "SuspensionLab API error rate > 5%"
            description: "API 5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes. Possible causes: database connectivity, unhandled exceptions, OOM."
            runbook_url: "https://wiki.suspensionlab.pro/runbooks/api-high-error-rate"

        - alert: APIHighLatencyP99
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{job="suspensionlab-api"}[5m])) by (le)
            ) > 3
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "SuspensionLab API P99 latency > 3s"
            description: "P99 latency is {{ $value | humanizeDuration }}. Physics simulation endpoints may be slow or a downstream dependency is degraded."

        - alert: APIPodsNotReady
          expr: |
            kube_deployment_status_replicas_ready{
              deployment="{{ .Release.Name }}-api",
              namespace="suspensionlab-prod"
            } < 2
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "SuspensionLab API has fewer than 2 ready replicas"
            description: "Ready replicas: {{ $value }}. Immediate action required — users are being load-balanced to a degraded pod set."

    # ── Worker Health ─────────────────────────────────────────────────────────
    - name: suspensionlab.workers.health
      interval: 60s
      rules:
        - alert: WorkerQueueDepthHigh
          expr: |
            suspensionlab_rq_queue_length{queue="default"} > 100
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "RQ worker queue depth > 100 jobs"
            description: "Queue depth: {{ $value }}. KEDA should be scaling workers, but autoscaling may be lagging. Simulation jobs are being delayed."

        - alert: WorkerOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{
              reason="OOMKilled",
              namespace="suspensionlab-prod",
              container="worker"
            } == 1
          for: 0m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "SuspensionLab worker pod OOMKilled"
            description: "Pod {{ $labels.pod }} was OOMKilled. Physics simulation exceeded memory limits. Consider increasing worker memory limits or optimizing simulation batch size."

    # ── Database Health ────────────────────────────────────────────────────────
    - name: suspensionlab.database.health
      interval: 60s
      rules:
        - alert: DatabaseConnectionPoolExhausted
          expr: |
            suspensionlab_db_pool_checked_out / suspensionlab_db_pool_size > 0.9
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Database connection pool >90% utilised"
            description: "Pool utilisation: {{ $value | humanizePercentage }}. Risk of connection timeout errors under load. Review slow queries or scale RDS instance."

        - alert: ReadinessProbeFailure
          expr: |
            probe_success{
              job="blackbox",
              instance="https://app.suspensionlab.pro/ready"
            } == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "SuspensionLab readiness probe failing"
            description: "The /ready endpoint is returning failure, indicating the database is unreachable. Check RDS status in AWS Console."

    # ── Certificate Expiry ─────────────────────────────────────────────────────
    - name: suspensionlab.tls
      interval: 1h
      rules:
        - alert: TLSCertificateExpiringSoon
          expr: |
            certmanager_certificate_expiration_timestamp_seconds{
              namespace="suspensionlab-prod"
            } - time() < 86400 * 14
          for: 1h
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "TLS certificate expiring in less than 14 days"
            description: "Certificate {{ $labels.name }} expires in {{ $value | humanizeDuration }}. cert-manager should be auto-renewing — check cert-manager logs."
{{- end }}
