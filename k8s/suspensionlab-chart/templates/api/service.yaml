apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: suspensionlab
    component: api
spec:
  selector:
    app: suspensionlab
    component: api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
