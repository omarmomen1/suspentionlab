{{- if and .Values.rbac .Values.rbac.create -}}
# ServiceAccount — Dedicated identity for the application components (API, Workers, Job).
# Replaces the default ServiceAccount to enforce least privilege.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app: suspensionlab
    component: rbac
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
---
# Role — Defines the minimum permissions required by the application.
# The application itself does not need access to Secrets or ConfigMaps directly via the API
# because they are mounted as environment variables by the kubelet.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-role
  namespace: {{ .Release.Namespace }}
  labels:
    app: suspensionlab
    component: rbac
rules:
  # The application does not require any Kubernetes API access.
  # This empty rules block enforces that the ServiceAccount has zero permissions.
  # If future features require API access (e.g., leader election), add rules here.
  []
---
# RoleBinding — Binds the Role to the ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    app: suspensionlab
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-role
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-sa
    namespace: {{ .Release.Namespace }}
{{- end }}
