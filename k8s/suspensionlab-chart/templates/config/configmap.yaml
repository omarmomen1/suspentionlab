apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: suspensionlab
    component: config
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
data:
  ENVIRONMENT: {{ .Values.environment | default "production" | quote }}
  PYTHONDONTWRITEBYTECODE: "1"
  REDIS_HOST: {{ include "suspensionlab.redisHost" . | quote }}
  REDIS_PORT: {{ include "suspensionlab.redisPort" . | quote }}
  REDIS_TLS: {{ .Values.workers.keda.enableTLS | default "true" | quote }}
