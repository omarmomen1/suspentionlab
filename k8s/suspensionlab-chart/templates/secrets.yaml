{{- if not .Values.externalSecrets.enabled }}
# Static Kubernetes Secret — used ONLY when External Secrets Operator is disabled.
# This is acceptable for development and staging environments where secrets are
# injected via CI/CD --set flags or a local .env process.
#
# PRODUCTION: This template is skipped (externalSecrets.enabled = true) and
# the external-secret.yaml template creates the Secret via AWS Secrets Manager.
# DO NOT enable both: they will conflict attempting to own the same Secret name.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: suspensionlab-prod
  annotations:
    # Document that these values are expected to be populated by CI/CD --set flags
    # in non-production environments only.
    environment: "{{ .Values.environment | default "development" }}"
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | b64enc | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
  API_KEY: {{ .Values.secrets.apiKey | b64enc | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | b64enc | quote }}
{{- end }}
