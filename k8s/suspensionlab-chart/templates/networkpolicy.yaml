  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: {{ .Values.networkPolicy.vpcCidr | default "10.0.0.0/16" }}
    ports:
    - protocol: TCP
      port: 5432
---
# 9. Sweeper CronJob Egress: Sweeper -> PostgreSQL 5432 and Redis 6379
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-sweeper-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app: suspensionlab
    component: sweeper
spec:
  podSelector:
    matchLabels:
      app: suspensionlab
      component: sweeper
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: {{ .Values.networkPolicy.vpcCidr | default "10.0.0.0/16" }}
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - ipBlock:
        cidr: {{ .Values.networkPolicy.vpcCidr | default "10.0.0.0/16" }}
    ports:
    - protocol: TCP
      port: 6379
{{- end }}
