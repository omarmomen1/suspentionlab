{{- if .Values.externalSecrets.enabled }}
# ExternalSecret — syncs secrets from AWS Secrets Manager into a Kubernetes Secret.
# This replaces the pattern of manually setting secret values in Helm values or
# passing them via --set flags in CI/CD (which exposes them in CI logs).
#
# Prerequisites:
#   1. External Secrets Operator installed in cluster:
#        helm repo add external-secrets https://charts.external-secrets.io
#        helm install external-secrets external-secrets/external-secrets \
#          -n external-secrets --create-namespace
#
#   2. The ServiceAccount for ESO must have the IAM role annotation (IRSA):
#        kubectl annotate serviceaccount external-secrets \
#          -n external-secrets \
#          eks.amazonaws.com/role-arn={{ .Values.externalSecrets.iamRoleArn }}
#
#   3. AWS Secrets Manager secret must be populated with real values
#      (Terraform creates the secret; populate via console or aws CLI):
#        aws secretsmanager put-secret-value \
#          --secret-id {{ .Values.externalSecrets.secretArn }} \
#          --secret-string '{"JWT_SECRET_KEY":"...","LEMON_SQUEEZY_API_KEY":"..."}'
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}-aws-secrets-manager
  namespace: suspensionlab-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-app-secrets
  namespace: suspensionlab-prod
  labels:
    app: suspensionlab
    component: secrets
spec:
  # Refresh interval — ESO will re-sync from Secrets Manager at this cadence.
  # Critical: if a secret is rotated in AWS, pods will get the new value within
  # this interval without requiring a redeployment.
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}

  secretStoreRef:
    name: {{ .Release.Name }}-aws-secrets-manager
    kind: SecretStore

  # The target Kubernetes Secret that ESO creates/maintains.
  # This replaces the static secrets.yaml template when externalSecrets.enabled = true.
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
    # Deletion policy: if the ExternalSecret is deleted, the Kubernetes Secret is deleted too
    deletionPolicy: Delete

  # Map individual keys from the AWS Secrets Manager JSON blob to Kubernetes Secret keys
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.secretArn }}
        property: DATABASE_URL

    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.secretArn }}
        property: REDIS_URL

    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secretArn }}
        property: REDIS_PASSWORD

    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secretArn }}
        property: JWT_SECRET_KEY

    - secretKey: API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secretArn }}
        property: API_KEY

    - secretKey: LEMON_SQUEEZY_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secretArn }}
        property: LEMON_SQUEEZY_API_KEY

    - secretKey: LEMON_SQUEEZY_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretArn }}
        property: LEMON_SQUEEZY_WEBHOOK_SECRET

    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secretArn }}
        property: GEMINI_API_KEY
{{- end }}
