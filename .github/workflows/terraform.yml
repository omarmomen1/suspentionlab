name: Terraform — Plan & Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"

env:
  AWS_REGION: "us-east-1"
  TF_VERSION: "1.7.5"
  TF_WORKING_DIR: "terraform"

# Prevent concurrent Terraform applies from running simultaneously,
# which would corrupt state even with DynamoDB locking.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel — queue instead

permissions:
  id-token: write    # OIDC-based AWS authentication
  contents: read
  pull-requests: write  # Post plan summary as PR comment

jobs:
  # ── 1. Terraform Validate & Lint (tflint) ───────────────────────────────────
  validate:
    name: Terraform Validate + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Set up Python for Security Validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Pre-Deployment Secrets Hardening Validation
        run: |
          pip install pyyaml
          python scripts/validate_deployment_secrets.py --scan-dir terraform --scan-dir k8s

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init (remote S3 backend)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.50.3

      - name: Init tflint plugins
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --init

      - name: Run tflint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --format compact

      - name: Run tfsec Security Scanner
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: false

  # ── 2. Terraform Plan ───────────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -detailed-exitcode \
            -var="environment=prod"
        # Exit codes: 0=no changes, 1=error, 2=changes present
        continue-on-error: true

      - name: Save plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 7

      - name: Post plan summary as PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            const planOutput = execSync(
              'terraform show -no-color tfplan',
              { cwd: '${{ env.TF_WORKING_DIR }}', maxBuffer: 1024 * 1024 * 10 }
            ).toString();

            const body = `## Terraform Plan
            \`\`\`hcl
            ${planOutput.substring(0, 60000)}
            \`\`\`
            **Exit code:** ${{ steps.plan.outputs.exitcode }} (0=no changes, 2=changes, 1=error)
            *Plan artifact saved for ${{ github.sha }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # ── 3. Terraform Apply (main branch only) ───────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    # Only apply on merge to main AND only if there are actual changes (exit code 2)
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.plan.outputs.plan-exitcode == '2'
    environment:
      name: terraform-production
      # Requires manual approval in GitHub Environments before apply proceeds
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply (from saved plan)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export outputs to SSM Parameter Store
        # Store critical Terraform outputs in SSM so the CI/CD deploy job can
        # retrieve them without hardcoding values or duplicating state reads.
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          ECR_BACKEND=$(terraform output -raw ecr_backend_url)
          ECR_FRONTEND=$(terraform output -raw ecr_frontend_url)
          WAF_ARN=$(terraform output -raw waf_web_acl_arn)

          aws ssm put-parameter \
            --name "/suspensionlab/ecr/backend-url" \
            --value "${ECR_BACKEND}" \
            --type String \
            --overwrite

          aws ssm put-parameter \
            --name "/suspensionlab/ecr/frontend-url" \
            --value "${ECR_FRONTEND}" \
            --type String \
            --overwrite

          aws ssm put-parameter \
            --name "/suspensionlab/waf/acl-arn" \
            --value "${WAF_ARN}" \
            --type String \
            --overwrite
