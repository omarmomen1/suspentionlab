name: CI — Lint, Test, Build, Scan, Deploy

on:
  push:
    branches: [main, master, staging, phase-7-6]
  pull_request:
    branches: [main, master, staging, phase-7-6]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  AWS_REGION: "us-east-1"

jobs:
  # ── 1. Python Lint & Typecheck ──────────────────────────────────────────────
  lint-python:
    name: Python Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff and mypy
        run: pip install ruff mypy

      - name: Run ruff lint
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

      - name: Run mypy static type check
        run: mypy src/ --ignore-missing-imports

  # ── 2. Python Unit Tests ────────────────────────────────────────────────────
  test-python:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    needs: lint-python
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: susplab
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: suspensionlab_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://susplab:test_password@localhost:5432/suspensionlab_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: DEV
      JWT_SECRET_KEY: test_jwt_secret_key_not_for_production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,prod]"

      - name: Run Alembic migrations (test DB)
        run: alembic upgrade head

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=src/suspensionlab \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── 3. Living Audit Evidence & Compliance Verification ──────────────────────
  audit-evidence:
    name: Living Audit Evidence & Compliance Pipeline
    runs-on: ubuntu-latest
    needs: test-python
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: susplab
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: suspensionlab_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://susplab:test_password@localhost:5432/suspensionlab_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: DEV
      JWT_SECRET_KEY: test_jwt_secret_key_not_for_production
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies & run migrations
        run: |
          pip install -e ".[dev,prod]"
          alembic upgrade head

      - name: Execute Living Audit Evidence Pipeline
        run: |
          python scripts/run_audit_pipeline.py --ci --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload Living Audit Evidence Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-audit-evidence-${{ github.sha }}
          path: |
            data/audit_evidence_manifest.json
            data/approval_governance_results.json
            data/scientific_validation_results.json
            data/native_solver_certification_results.json
            data/hostile_scientific_reaudit_evidence.json
            data/tenant_isolation_canary_results.json
            data/absolute_tenant_isolation_evidence.json
            data/production_deployment_reality_evidence.json
          retention-days: 90

  # ── 4. Build C++ Kinematics Wheels (cibuildwheel) ───────────────────────────
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test-python
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14] # macos-14 is M1 arm64
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run C++ Kinematics Tests (CMake / CTest)
        if: runner.os == 'Linux'
        run: |
          cmake -B src/kinematics_cpp/build -S src/kinematics_cpp -DBUILD_TESTING=ON
          cmake --build src/kinematics_cpp/build --config Release
          ctest --test-dir src/kinematics_cpp/build --output-on-failure

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.17.0
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_MACOS: "arm64"
        with:
          package-dir: src/kinematics_cpp
          
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  # ── 4. Python Performance Benchmarks ────────────────────────────────────────
  benchmark-python:
    name: Python Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install memory-profiler psutil

      - name: Run Physics Benchmarks
        run: |
          # Fails if the benchmark suite throws exceptions
          python scripts/benchmark_suite.py

  # ── 5. Frontend Lint, Unit Tests & Build Validation ─────────────────────────
  lint-frontend:
    name: Frontend Lint + Unit Tests + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - name: Run Frontend Unit Tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build frontend (validates compilation)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── 6. Helm Chart Validation ────────────────────────────────────────────────
  validate-helm:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm lint (default values)
        run: helm lint k8s/suspensionlab-chart

      - name: Helm template dry-run (prod values)
        run: |
          helm template suspensionlab k8s/suspensionlab-chart \
            -f k8s/suspensionlab-chart/values-prod.yaml \
            --set api.image.repository=123456789.dkr.ecr.us-east-1.amazonaws.com/suspensionlab/backend \
            --set api.image.tag=sha-abc1234 \
            --set ui.image.repository=123456789.dkr.ecr.us-east-1.amazonaws.com/suspensionlab/frontend \
            --set ui.image.tag=sha-abc1234 \
            --set workers.image.repository=123456789.dkr.ecr.us-east-1.amazonaws.com/suspensionlab/backend \
            --set workers.image.tag=sha-abc1234 \
            > /dev/null

  # ── 7. End-to-End (E2E) Browser Tests (Playwright) ───────────────────────────
  e2e-playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [test-python, lint-frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: susplab
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: suspensionlab_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://susplab:test_password@localhost:5432/suspensionlab_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: DEV
      JWT_SECRET_KEY: test_jwt_secret_key_not_for_production
      NEXT_PUBLIC_API_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies & run migrations
        run: |
          pip install -e ".[dev,prod]"
          alembic upgrade head

      - name: Install frontend dependencies & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Backend Server
        run: |
          python -m uvicorn suspensionlab.backend.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Start Frontend Server
        working-directory: frontend
        run: |
          npm run start -- -p 3000 &
          sleep 5

      - name: Run Playwright E2E Tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── 9. Build Docker Images ──────────────────────────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-python, lint-frontend, validate-helm, e2e-playwright, audit-evidence]
    # Only build and push on pushes to main/staging (not PRs)
    if: github.event_name == 'push'
    permissions:
      id-token: write   # Required for OIDC-based AWS authentication
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      ecr-backend-url: ${{ steps.ecr-login.outputs.registry }}/suspensionlab/backend
      ecr-frontend-url: ${{ steps.ecr-login.outputs.registry }}/suspensionlab/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag from git SHA
        id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx (multi-platform, cache support)
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/suspensionlab/backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/suspensionlab/frontend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ── 6. Container Image Scanning (Trivy) ────────────────────────────────────
  scan-images:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
      security-events: write  # Required for SARIF upload to GitHub Security tab

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Scan backend image for CRITICAL/HIGH CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.ecr-login.outputs.registry }}/suspensionlab/backend:${{ needs.build-images.outputs.image-tag }}"
          format: "sarif"
          output: "trivy-backend.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"  # Fail the pipeline on CRITICAL or HIGH CVEs

      - name: Upload Trivy backend results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Scan frontend image for CRITICAL/HIGH CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.ecr-login.outputs.registry }}/suspensionlab/frontend:${{ needs.build-images.outputs.image-tag }}"
          format: "sarif"
          output: "trivy-frontend.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy frontend results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # ── 7. Deploy to EKS via Helm ──────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [build-images, scan-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://app.suspensionlab.pro
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get Terraform outputs (ECR URLs, WAF ARN)
        id: tf-outputs
        run: |
          # Retrieve infra outputs without storing them as unmasked env vars
          ECR_BACKEND=$(aws ssm get-parameter --name "/suspensionlab/ecr/backend-url" --query Parameter.Value --output text)
          ECR_FRONTEND=$(aws ssm get-parameter --name "/suspensionlab/ecr/frontend-url" --query Parameter.Value --output text)
          WAF_ARN=$(aws ssm get-parameter --name "/suspensionlab/waf/acl-arn" --query Parameter.Value --output text)
          echo "ecr-backend=${ECR_BACKEND}" >> "$GITHUB_OUTPUT"
          echo "ecr-frontend=${ECR_FRONTEND}" >> "$GITHUB_OUTPUT"
          echo "waf-arn=${WAF_ARN}" >> "$GITHUB_OUTPUT"

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name suspensionlab-prod \
            --region ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm upgrade (with Helm pre-install migration Job)
        run: |
          IMAGE_TAG="${{ needs.build-images.outputs.image-tag }}"
          helm upgrade --install suspensionlab ./k8s/suspensionlab-chart \
            -f k8s/suspensionlab-chart/values-prod.yaml \
            --namespace suspensionlab-prod \
            --create-namespace \
            --atomic \
            --timeout 10m \
            --set api.image.repository="${{ steps.tf-outputs.outputs.ecr-backend }}" \
            --set api.image.tag="${IMAGE_TAG}" \
            --set ui.image.repository="${{ steps.tf-outputs.outputs.ecr-frontend }}" \
            --set ui.image.tag="${IMAGE_TAG}" \
            --set workers.image.repository="${{ steps.tf-outputs.outputs.ecr-backend }}" \
            --set workers.image.tag="${IMAGE_TAG}" \
            --set ingress.annotations."alb\.ingress\.kubernetes\.io/wafv2-acl-arn"="${{ steps.tf-outputs.outputs.waf-arn }}" \
            --set externalSecrets.iamRoleArn="${{ secrets.EXTERNAL_SECRETS_IAM_ROLE_ARN }}" \
            --set externalSecrets.secretArn="${{ secrets.APP_SECRETS_ARN }}"

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/suspensionlab-api \
            -n suspensionlab-prod --timeout=5m
          kubectl rollout status deployment/suspensionlab-ui \
            -n suspensionlab-prod --timeout=5m

      - name: Smoke test — health endpoint
        run: |
          sleep 15
          curl --fail --retry 3 --retry-delay 5 \
            https://app.suspensionlab.pro/health
