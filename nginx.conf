worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Define a rate limit zone: 10 megabytes of state memory, 50 requests per second allowed per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Backend upstream
    upstream backend_api {
        server backend:8000;
    }

    # ── HTTP :80 — ACME challenges + redirect to HTTPS ──────────────────────
    server {
        listen 80;
        server_name suspensionlab.pro;

        # ACME HTTP-01 challenge for certificate renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS :443 — TLS termination + rate-limited API proxy ───────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name suspensionlab.pro;

        # Certificates managed by certbot (mounted volume in compose/k8s)
        ssl_certificate     /etc/letsencrypt/live/suspensionlab.pro/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/suspensionlab.pro/privkey.pem;

        # Modern TLS only (Mozilla intermediate profile)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # Rate limited location for all API endpoints
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
